<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Google Карты без интернета - варианты оформления инструкции</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Google Sans", Roboto, "Segoe UI", sans-serif;
    background: #0f141b;
    color: #f1f5f9;
    display: grid;
    grid-template-rows: auto 1fr;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    background: #161c24;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-title {
    font-size: 14px;
    font-weight: 700;
    color: #f8fafc;
  }

  .brand-sub {
    font-size: 12px;
    color: #94a3b8;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tabs {
    display: inline-flex;
    background: #0f141b;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    gap: 2px;
  }

  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: #94a3b8;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .tab:hover {
    color: #f8fafc;
  }

  .tab.active {
    background: #1a73e8;
    color: #ffffff;
  }

  .ext-link {
    font-size: 12px;
    font-weight: 600;
    color: #93c5fd;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(147, 197, 253, 0.25);
    transition: background 0.15s;
  }

  .ext-link:hover {
    background: rgba(147, 197, 253, 0.12);
  }

  .stage {
    position: relative;
    min-height: 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #e8eaed;
  }

  @media (max-width: 680px) {
    .topbar { padding: 10px 12px; }
    .brand-sub { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2C7.58 2 4 5.58 4 10c0 5.5 8 12 8 12s8-6.5 8-12c0-4.42-3.58-8-8-8z" fill="#ea4335"/>
      <circle cx="12" cy="10" r="3.4" fill="#ffffff"/>
    </svg>
    <div>
      <div class="brand-title">Google Карты без интернета</div>
      <div class="brand-sub">Два варианта вёрстки короткой инструкции</div>
    </div>
  </div>

  <div class="controls">
    <div class="tabs" id="variantTabs">
      <button type="button" class="tab active" data-src="native.html">Вариант 1: Нативный Google Карты</button>
      <button type="button" class="tab" data-src="bento.html">Вариант 2: Компактный Bento</button>
    </div>
    <a class="ext-link" id="openDirect" href="native.html" target="_blank" rel="noopener">Открыть отдельно ↗</a>
  </div>
</header>

<main class="stage">
  <iframe id="previewFrame" src="native.html" title="Инструкция по офлайн Google Картам"></iframe>
</main>

<script>
(function() {
  var tabs = document.querySelectorAll("#variantTabs .tab");
  var frame = document.getElementById("previewFrame");
  var ext = document.getElementById("openDirect");

  tabs.forEach(function(btn) {
    btn.addEventListener("click", function() {
      var src = btn.getAttribute("data-src");
      tabs.forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      frame.src = src;
      ext.href = src;
    });
  });
})();
</script>
</body>
</html>
